name: iOS Build

on:
  workflow_dispatch:          # manual trigger from GitHub UI
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'capacitor.config.json'
      - 'package.json'
      - 'vite.config.js'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Capacitor iOS platform
        run: npx cap add ios

      - name: Show iOS structure
        run: find ios -maxdepth 3 | sort

      - name: Install CocoaPods
        run: |
          PODFILE_DIR=$(find ios -name "Podfile" -exec dirname {} \; | head -1)
          echo "Podfile found at: $PODFILE_DIR"
          cd "$PODFILE_DIR" && pod install --repo-update

      - name: Build app (unsigned)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -1)
          echo "Workspace: $WORKSPACE"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/when2go.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -allowProvisioningUpdates \
            | xcpretty || true

      - name: Package as IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -r "$RUNNER_TEMP/when2go.xcarchive/Products/Applications/App.app" \
            $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r when2go.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: when2go-ios
          path: ${{ runner.temp }}/when2go.ipa
          retention-days: 7
